spring:
  application:
    name: operation-assistant
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eoa}
    username: ${SPRING_DATASOURCE_USERNAME:eoa}
    password: ${SPRING_DATASOURCE_PASSWORD:PLACEHOLDER}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
